<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wardro — Fotók küldése</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #EBE2D2;
    color: #57462F;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font: 600 22px/1.2 'Instrument Sans', sans-serif; margin: 0 0 4px; }
  p.sub { font: 400 14px/1.5 'Instrument Sans', sans-serif; color: #6B5940; margin: 0 0 26px; }
  .row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 22px; }
  .pick {
    height: 54px; border-radius: 16px; background: #57462F; color: #F6F1E7;
    display: flex; align-items: center; justify-content: center;
    font: 600 15px 'Instrument Sans', sans-serif; cursor: pointer; border: none;
  }
  .pick.secondary { background: #F6F1E7; color: #57462F; border: 1px solid rgba(87,70,47,.18); }
  input[type=file] { display: none; }
  ul#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 10px;
    background: #F6F1E7; border-radius: 12px; padding: 9px 12px;
    font: 400 13px 'Instrument Sans', sans-serif;
  }
  li img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex: none; background: #DCD8CE; }
  li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .status { font: 500 11px 'Instrument Sans', sans-serif; flex: none; }
  li .status.ok { color: #4C7A3A; }
  li .status.err { color: #B8433A; }
  li .status.busy { color: #8A5A22; }
  #banner {
    border-radius: 14px; padding: 14px 16px; margin-bottom: 20px;
    font: 400 14px/1.5 'Instrument Sans', sans-serif;
  }
  #banner.error { background: #F6E4E1; color: #8A2E22; }
  #banner.ok { background: #EDF2E7; color: #3E5C2E; }
</style>
</head>
<body>
  <h1>Wardro</h1>
  <p class="sub">Küldd a fotókat egyenesen a számítógépeden megnyitott munkamenetbe.</p>

  <div id="banner" class="error" hidden></div>

  <div id="app" hidden>
    <div class="row">
      <button class="pick" id="camBtn">Fotó készítése</button>
      <button class="pick secondary" id="libBtn">Válogatás a galériából</button>
    </div>
    <input type="file" id="camInput" accept="image/*" capture="environment">
    <input type="file" id="libInput" accept="image/*" multiple>
    <ul id="list"></ul>
  </div>

<script>
(function () {
  var TOKEN = "__TOKEN__";
  var VALID = "__VALID__" === "1";
  var banner = document.getElementById('banner');
  var app = document.getElementById('app');
  var list = document.getElementById('list');

  function showBanner(kind, text) {
    banner.className = kind;
    banner.textContent = text;
    banner.hidden = false;
  }

  if (!VALID) {
    showBanner('error', 'Ez a kód lejárt vagy már nem aktív. Menj vissza a számítógéphez, és koppints újra a "Telefon csatlakoztatása" gombra egy új kódért.');
    return;
  }
  app.hidden = false;

  var sentCount = 0;

  function addRow(file) {
    var li = document.createElement('li');
    var img = document.createElement('img');
    var name = document.createElement('span');
    var status = document.createElement('span');
    name.className = 'name';
    name.textContent = file.name || 'fotó';
    status.className = 'status busy';
    status.textContent = 'Küldés…';
    li.appendChild(img);
    li.appendChild(name);
    li.appendChild(status);
    list.prepend(li);
    var reader = new FileReader();
    reader.onload = function () { img.src = reader.result; };
    reader.readAsDataURL(file);
    return status;
  }

  function upload(file) {
    var status = addRow(file);
    var name = encodeURIComponent(file.name || ('photo-' + Date.now() + '.jpg'));
    fetch('/api/pair/' + TOKEN + '/upload?name=' + name, {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'image/jpeg' },
      body: file,
    }).then(function (r) {
      if (r.status === 410) {
        status.className = 'status err';
        status.textContent = 'Lejárt';
        showBanner('error', 'Ez a kód épp most járt le. A már elküldött fotók biztonságban vannak a számítógépen, de új kódra lesz szükséged, ha többet is küldenél.');
        return;
      }
      if (!r.ok) throw new Error('upload failed: ' + r.status);
      status.className = 'status ok';
      status.textContent = 'Elküldve';
      sentCount++;
      showBanner('ok', sentCount + ' fotó elküldve a számítógépedre.');
    }).catch(function () {
      status.className = 'status err';
      status.textContent = 'Sikertelen';
    });
  }

  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList || []);
    files.forEach(function (f) {
      if (f.type && f.type.indexOf('image/') !== 0) return;
      upload(f);
    });
  }

  document.getElementById('camBtn').addEventListener('click', function () {
    document.getElementById('camInput').click();
  });
  document.getElementById('libBtn').addEventListener('click', function () {
    document.getElementById('libInput').click();
  });
  document.getElementById('camInput').addEventListener('change', function (e) {
    handleFiles(e.target.files);
    e.target.value = '';
  });
  document.getElementById('libInput').addEventListener('change', function (e) {
    handleFiles(e.target.files);
    e.target.value = '';
  });

  // Időnként ellenőrizzük, hogy a munkamenet még él-e (pl. ha valaki sokáig tétlen marad az oldalon).
  setInterval(function () {
    fetch('/api/pair/' + TOKEN + '/status').then(function (r) {
      if (r.status === 404) showBanner('error', 'Ez a kód lejárt. Menj vissza a számítógéphez egy újért.');
    }).catch(function () {});
  }, 60000);
})();
</script>
</body>
</html>
